jevintegration.application-context=jevintegration-spring.xml

# --- Jev connection ----------------------------------------------------------------------------
jev.api.url=https://api.typesafe.ai/v1/systemone
# Never commit a key. Locally: local.properties. CCv2: Cloud Portal > environment > service properties.
# Empty key = every call is skipped, and nothing is judged or changed.
jev.api.key=
# Pin the version your thresholds were tuned on. jev-latest moves when TypeSafe ships a new model.
jev.model=jev-1.13.0
jev.timeout.ms=2000
jev.max.attempts=3

# --- Review moderation policy ------------------------------------------------------------------
# Starting guesses. Measure them with the dry-run cronjob on reviews your moderators already decided,
# then adjust. Abusive or spam at or above reject.at: rejected.
jev.review.reject.at=0.85
# Every risk below approve.below and on topic: approved. Anything in between stays pending for a person.
jev.review.approve.below=0.15
# Personal data at or above this: pending, so a person can edit instead of rejecting.
jev.review.personaldata.at=0.5
jev.review.ontopic.at=0.5
# Reviews per run. Calls are sequential, about 3 per second.
jev.review.batch.size=200

# --- Category suggestions -------------------------------------------------------------------------
# The category tree Jev chooses from: one or more root category codes (comma-separated) in this catalog version.
# Classification classes and variant categories below them are left out.
jev.category.catalog=
jev.category.catalogVersion=Staged
jev.category.roots=
# A suggestion's score is the geometric mean of Jev's probabilities along its path. Below this: left for a merchandiser.
jev.category.min.score=0.7
# Paths kept per level (TypeSafe's beam search). 1 = greedy: one question per level, no second chances.
jev.category.beam.width=3
# Products per run. Each product takes one request per level of the tree.
jev.category.batch.size=100
